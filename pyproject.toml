[project]
name = "kosmorrolib"
version = "1.0.13"
authors = [
    { name = "Jérôme Deuchnord", email = "jerome@deuchnord.fr" }
]
homepage = "https://kosmorro.space/lib"
repository = "https://github.com/Kosmorro/lib"
documentation = "https://kosmorro.space/lib/doc"
keywords = ["kosmorro", "astronomy", "ephemerides", "ephemeris"]
license = "AGPL-3.0-or-later"
description = "A library to computes the ephemerides."
readme = "README.md"

requires-python = "^3.11"
dependencies = [
    "skyfield (>=1.49,<2.0)",
    "numpy (>=2.3,<3.0)",
    "skyfield-data (>=7.0.0)",
    "python-dateutil (>=2.8,<3.0)"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
]

[tool.poetry.group.dev.dependencies]
black = ">=23.1"
parameterized = "^0.9.0"
coverage = ">=6.1"
coveralls = ">=3.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
